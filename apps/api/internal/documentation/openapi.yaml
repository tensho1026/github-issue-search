openapi: 3.1.0
info:
  title: IssueScout API
  summary: Anonymous GitHub discovery with optional account-owned workflows
  version: 0.8.0
  description: |
    API for analyzing a public GitHub profile and finding suitable open-source
    repositories and issues. Core discovery remains anonymous and stateless.
    Optional GitHub sign-in adds server-side sessions for account-owned
    features; GitHub and database credentials always remain server-side.

    Every response carries `X-Request-ID`, and JSON envelopes repeat the value
    in `meta.requestId`. Public GitHub operations are bounded by explicit
    deadlines and concurrency limits. A `504` represents cancellation or a
    deadline, `429` represents GitHub rate exhaustion, and `502` represents a
    required upstream dependency failure. Successful discovery responses can
    preserve partial evidence through typed warnings rather than silently
    converting unknown data to zero.

    The contract is served byte-for-byte at `/openapi.yaml`. Interactive,
    CDN-free Swagger UI is available at `/docs/` when API documentation is
    enabled. Cookie-authenticated examples require an existing browser session;
    mutations additionally require `X-CSRF-Token`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security: []
tags:
  - name: System
    description: Runtime health and operational endpoints.
  - name: GitHub profiles
    description: Normalized public GitHub profile and technology analysis.
  - name: Issue discovery
    description: Bounded, validated discovery of eligible public GitHub issues.
  - name: Repository discovery
    description: Bounded, evidence-oriented discovery of public OSS repositories.
  - name: Issue recommendations
    description: Explainable scoring and bounded repository-maintainer analysis.
  - name: Authentication
    description: |
      Optional GitHub OAuth with PKCE, single-use state, rotating server
      sessions, and CSRF-protected mutations. Authentication is never an
      anonymous-feature access wall.
  - name: Account workspace
    description: |
      Authenticated, account-owned bookmarks, saved searches, preferences,
      privacy export, and irreversible account deletion. These routes never
      accept an account identifier from the client.
paths:
  /api/health:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: getHealth
      summary: Check API health
      description: |
        Reports process readiness without calling GitHub or PostgreSQL. This is
        the load-balancer probe and remains independent from optional account
        storage health.
      tags:
        - System
      responses:
        "200":
          description: The API process is ready to serve requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              examples:
                ready:
                  $ref: "#/components/examples/HealthSuccess"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/health/database:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: getDatabaseHealth
      summary: Check authenticated account storage readiness
      description: |
        Probes the optional PostgreSQL boundary used only by authenticated
        account capabilities. A failure does not change `/api/health` and does
        not prevent anonymous profile, repository, or issue journeys.
        Connection parameters and driver errors are never returned.
      tags:
        - System
      responses:
        "200":
          description: The configured database accepted a bounded readiness probe.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthEnvelope"
              examples:
                ready:
                  $ref: "#/components/examples/DatabaseHealthSuccess"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: getGitHubUser
      summary: Get a normalized public GitHub profile
      description: |
        Returns one public GitHub identity and a bounded repository summary.
        The adapter propagates cancellation and never returns the upstream
        GitHub response shape or server credential.
      tags:
        - GitHub profiles
      responses:
        "200":
          description: The public profile and bounded repository summaries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserEnvelope"
              examples:
                normalized-profile:
                  $ref: "#/components/examples/GitHubUserSuccess"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}/profile-analysis:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: analyzeGitHubProfile
      summary: Analyze bounded public technical and OSS evidence
      description: |
        Executes one bounded GitHub GraphQL snapshot over active public owned
        repositories, public forks, public contributed repositories, visible
        starred repositories, public authored issues and pull requests, and
        sampled public commit and review activity. The analysis window is 365
        days. Repository collections are capped at 20 and language edges at 10
        per owned repository. Exact, sampled, and unavailable evidence are
        distinct so zero is never used for missing data. Starred repositories
        represent interest and never increase proficiency scores. Private and
        restricted contribution totals are neither requested nor returned.
        Anonymous requests do not use a database or persist the username,
        upstream response, or derived profile.
      tags:
        - GitHub profiles
      responses:
        "200":
          description: A bounded analysis with optional partial-data warnings.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAnalysisEnvelope"
              examples:
                bounded-evidence:
                  $ref: "#/components/examples/ProfileAnalysisSuccess"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/search:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      operationId: searchGitHubIssues
      summary: Find eligible public GitHub issue candidates
      description: |
        Searches one bounded, authenticated GitHub GraphQL Search window of at
        most 50 candidates and retrieves the required repository fields in the
        same request. It then applies repository and issue eligibility rules
        before bounded detail enrichment, effort filtering, stable ranking,
        and application pagination. Equivalent validated discovery filter
        orderings share a five-minute in-memory candidate cache. At most 20
        candidates are enriched with bounded concurrency, and effort-only
        changes reuse the candidate window. The endpoint never follows
        unbounded upstream pages or returns GitHub response objects directly.
        The IssueScout endpoint is anonymous to browser clients, while the API
        process requires a server-only GITHUB_TOKEN for upstream GraphQL
        requests.
      tags:
        - Issue discovery
      parameters:
        - name: page
          in: query
          required: false
          description: One-based page over eligible candidates.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          description: Maximum eligible candidates returned on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      requestBody:
        required: true
        description: |
          Validated discovery filters. Omitted scalar filters receive the
          documented MVP defaults. Unknown JSON fields are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSearchRequest"
            examples:
              profile-aligned:
                summary: Search Go and TypeScript starter issues
                value:
                  username: tensho1026
                  languages:
                    - Go
                    - TypeScript
                  frameworks:
                    - Gin
                    - React
                  labels:
                    - good first issue
                    - help wanted
                  minimumStars: 10
                  maximumDifficulty: 3
                  maximumEffort: one_day
                  updatedWithinDays: 180
                  includeDocumentation: false
                  includeEnglish: true
                  excludeArchived: true
      responses:
        "200":
          description: |
            Eligible, normalized candidates and bounded pagination metadata.
            A successful response can contain no items.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              $ref: "#/components/headers/CacheStatus"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSearchEnvelope"
              examples:
                empty-result:
                  $ref: "#/components/examples/IssueSearchEmpty"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/repositories/search:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      operationId: searchGitHubRepositories
      summary: Find contribution-ready public OSS repositories
      description: |
        Executes one bounded GitHub REST repository search containing at most
        50 normalized public candidates. Cheap language, SPDX license,
        popularity, fork, issue-count, archive, and recency filters run before
        a shortlist of at most 20 repositories receives one batched GraphQL
        quality and documentation enrichment. README language and technology
        detection are heuristics over at most 64 KiB of text and always expose
        evidence status and confidence. The final order is deterministic:
        readiness, stars, last push, then canonical full name. Equivalent
        validated conditions share a five-minute bounded in-memory cache.
        Anonymous requests never access a database or persist the query or
        results.
      tags:
        - Repository discovery
      parameters:
        - name: page
          in: query
          required: false
          description: One-based page over the bounded analyzed shortlist.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          description: Maximum analyzed repositories returned on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      requestBody:
        required: true
        description: |
          Validated public repository filters. Unknown fields and unsupported
          SPDX identifiers or range combinations are rejected before GitHub.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryDiscoveryRequest"
            examples:
              typed-japanese-projects:
                summary: Active React or TypeScript projects with Japanese docs
                value:
                  languages:
                    - TypeScript
                  technologies:
                    - React
                  licenses:
                    - MIT
                    - Apache-2.0
                  categories:
                    - framework
                    - tooling
                  minimumStars: 50
                  minimumForks: 2
                  minimumOpenIssues: 1
                  maximumOpenIssues: 500
                  updatedWithinDays: 180
                  maximumDifficulty: 3
                  minimumReadiness: 50
                  hasJapaneseReadme: true
                  forkPolicy: exclude
                  excludeArchived: true
      responses:
        "200":
          description: |
            Deterministically ordered normalized repositories with bounded
            enrichment, evidence precision, and pagination metadata. A
            successful partial or empty result is valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              $ref: "#/components/headers/CacheStatus"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiscoveryEnvelope"
              examples:
                partial-upstream-evidence:
                  $ref: "#/components/examples/RepositoryDiscoveryPartial"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/{owner}/{repository}/{issueNumber}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
      - $ref: "#/components/parameters/GitHubOwner"
      - $ref: "#/components/parameters/GitHubRepository"
      - $ref: "#/components/parameters/GitHubIssueNumber"
    get:
      operationId: getIssueRecommendation
      summary: Get a complete explainable issue recommendation
      description: |
        Retrieves one bounded public GitHub GraphQL snapshot and returns the
        normalized repository, full issue, rule analysis, 100-point score,
        repository-readiness signals, and sampled maintainer activity. Commit,
        issue, pull-request, review, and comment collections are bounded and
        never paginated beyond the documented sample. Missing or partial
        upstream evidence is `unknown` or `unavailable`, never a misleading
        zero or absence. Equivalent owner/repository/number references share a
        five-minute bounded LRU snapshot cache.
      tags:
        - Issue recommendations
      parameters:
        - name: skills
          in: query
          required: false
          description: |
            Repeatable contributor skill. Matching is case-insensitive and
            deduplicated. Low-confidence requirements and a missing skill set
            are excluded from the explicit percentage denominator.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 64
          style: form
          explode: true
          examples:
            go-react:
              value:
                - Go
                - React
      responses:
        "200":
          description: Complete normalized issue recommendation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              $ref: "#/components/headers/CacheStatus"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetailEnvelope"
              examples:
                analyzed-issue:
                  $ref: "#/components/examples/IssueDetailSuccess"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubIssueNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/auth/session:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: getAuthSession
      summary: Read optional browser-session state
      description: |
        Returns `configured=false` when GitHub OAuth is intentionally disabled
        and `authenticated=false` when both opaque browser cookies are absent
        or malformed. Those anonymous outcomes do not query PostgreSQL.
        An authenticated response contains only the retained public GitHub
        identity and a CSRF token for in-memory use by the frontend. The opaque
        session token is never returned in JSON.
      tags:
        - Authentication
      responses:
        "200":
          description: Current optional authentication state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
              examples:
                anonymous:
                  $ref: "#/components/examples/AuthSessionAnonymous"
                authenticated:
                  $ref: "#/components/examples/AuthSessionAuthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/auth/github/start:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: startGitHubOAuth
      summary: Start GitHub authorization with PKCE
      description: |
        Creates a random single-use state record containing only a SHA-256
        digest. The raw state, PKCE verifier, exact return path, and expiry are
        sealed with AES-256-GCM in a short-lived HttpOnly SameSite=Lax cookie.
        The response redirects to the configured GitHub authorization endpoint
        with explicit `read:user`, the exact registered callback URL, and an
        S256 PKCE challenge.
      tags:
        - Authentication
      parameters:
        - name: returnTo
          in: query
          required: false
          description: |
            Bounded root-relative frontend path. Absolute URLs, scheme-relative
            paths, backslashes, and fragments are rejected. Defaults to `/`.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: "^/(?!/)(?!.*\\\\).*$"
          example: /workspace?tab=saved
      responses:
        "302":
          description: Redirect to GitHub's configured authorization endpoint.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/auth/github/callback:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: completeGitHubOAuth
      summary: Complete or deny one GitHub authorization
      description: |
        GitHub redirects the top-level browser navigation here. The API opens
        and expires the encrypted flow cookie, constant-time compares query
        state, atomically consumes the matching database state, exchanges the
        one-time code with its PKCE verifier, fetches only `GET /user`, and
        immediately discards the GitHub access token. Success writes rotating
        opaque session and CSRF cookies whose SHA-256 digests are persisted.
        Provider denial also consumes state. Every browser redirect is built
        from the fixed configured frontend origin and the previously validated
        relative return path; provider error descriptions are never reflected.
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: false
          description: GitHub one-time authorization code; required on success.
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: state
          in: query
          required: true
          description: Unpadded base64url encoding of the random 256-bit state.
          schema:
            $ref: "#/components/schemas/OpaqueCredential"
        - name: error
          in: query
          required: false
          description: |
            GitHub denial code. `access_denied` produces a safe `auth=denied`
            frontend marker; other values produce `auth=error`.
          schema:
            type: string
            maxLength: 255
      responses:
        "302":
          description: |
            Redirect to the fixed frontend origin with `auth=success`,
            `auth=denied`, or `auth=error`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Location:
              $ref: "#/components/headers/RedirectLocation"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
        "400":
          $ref: "#/components/responses/InvalidAuthCallback"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "502":
          $ref: "#/components/responses/OAuthUpstreamUnavailable"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/auth/session/refresh:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      operationId: refreshAuthSession
      summary: Rotate the current browser session
      description: |
        Requires both valid HttpOnly cookies and a constant-time matching
        `X-CSRF-Token` header. The server revokes the current hashed session
        token and inserts new session and CSRF digests in one transaction.
        Concurrent reuse of the old session fails closed.
      tags:
        - Authentication
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Rotated session state and the new in-memory CSRF token.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AuthMutationForbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/auth/logout:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    post:
      operationId: logoutAuthSession
      summary: Revoke the current browser session
      description: |
        Requires the same cookie and CSRF checks as refresh. Server-side
        revocation completes before both browser cookies are expired. No
        GitHub token is retained or revoked because it was discarded at login.
      tags:
        - Authentication
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: The server session was revoked and cookies were expired.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Set-Cookie:
              $ref: "#/components/headers/AuthSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutEnvelope"
              examples:
                revoked:
                  $ref: "#/components/examples/AuthLogoutSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AuthMutationForbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/account/bookmarks:
    parameters:
      - $ref: "#/components/parameters/RequestID"
    get:
      operationId: listAccountBookmarks
      summary: List owned bookmarks
      description: |
        Returns normalized GitHub references ordered by createdAt descending
        and UUID descending. References are marked `unverified` because a
        repository or issue can be renamed, made private, or deleted upstream;
        use the anonymous public detail routes to revalidate when displaying
        one. No GitHub response body is persisted.
      tags:
        - Account workspace
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountPage"
        - $ref: "#/components/parameters/AccountPerPage"
      responses:
        "200":
          description: A deterministic owned bookmark page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkListEnvelope"
              examples:
                owned-page:
                  $ref: "#/components/examples/AccountBookmarksSuccess"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "503":
          $ref: "#/components/responses/AccountStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
    put:
      operationId: upsertAccountBookmark
      summary: Idempotently bookmark a GitHub reference
      description: |
        Requires a valid session and CSRF header. The account is selected only
        from the server-side principal. A duplicate normalized reference
        returns the existing row without incrementing version. Each account is
        limited to 200 bookmarks.
      tags:
        - Account workspace
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        description: |
          One normalized public GitHub reference. Unknown fields are rejected;
          `issueNumber` is required only when kind is `issue`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkWriteRequest"
      responses:
        "200":
          description: The newly inserted or existing owned bookmark.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AuthMutationForbidden"
        "409":
          $ref: "#/components/responses/AccountConflict"
        "503":
          $ref: "#/components/responses/AccountStorageUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/account/bookmarks/{bookmarkID}:
    parameters:
      - $ref: "#/components/parameters/RequestID"
