      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - deleted
            - removed
          properties:
            deleted:
              type: boolean
              const: true
            removed:
              $ref: "#/components/schemas/OwnedDataSummary"
        meta:
          $ref: "#/components/schemas/Meta"
    OwnedDataSummary:
      type: object
      additionalProperties: false
      required:
        - bookmarks
        - identities
        - preferences
        - savedSearches
        - sessions
      properties:
        bookmarks:
          type: integer
          format: int64
          minimum: 0
        identities:
          type: integer
          format: int64
          minimum: 0
        preferences:
          type: integer
          format: int64
          minimum: 0
        savedSearches:
          type: integer
          format: int64
          minimum: 0
        sessions:
          type: integer
          format: int64
          minimum: 0
    GitHubUserEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/GitHubUser"
        meta:
          $ref: "#/components/schemas/Meta"
    GitHubUser:
      type: object
      additionalProperties: false
      required:
        - avatarUrl
        - bio
        - followers
        - following
        - login
        - name
        - publicRepos
        - repositories
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
        publicRepos:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
        repositories:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RepositorySummary"
    RepositorySummary:
      type: object
      additionalProperties: false
      required:
        - defaultBranch
        - description
        - forks
        - fullName
        - isArchived
        - isFork
        - mainLanguage
        - name
        - openIssues
        - owner
        - pushedAt
        - stars
        - updatedAt
        - url
      properties:
        owner:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        mainLanguage:
          type: string
        stars:
          type: integer
          minimum: 0
        forks:
          type: integer
          minimum: 0
        openIssues:
          type: integer
          minimum: 0
        isFork:
          type: boolean
        isArchived:
          type: boolean
        defaultBranch:
          type: string
        updatedAt:
          type: string
        pushedAt:
          type: string
    ProfileAnalysisEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ProfileAnalysis"
        meta:
          $ref: "#/components/schemas/Meta"
    ProfileAnalysis:
      type: object
      additionalProperties: false
      required:
        - analysisWindow
        - contributions
        - frameworks
        - languageStatus
        - languages
        - ossExperience
        - proficiency
        - recentTechnologies
        - repositoryEvidence
        - repositoriesAnalyzed
        - username
        - warnings
      properties:
        username:
          type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageShare"
        languageStatus:
          allOf:
            - $ref: "#/components/schemas/EvidenceStatus"
          description: |
            Completeness of the aggregate language percentages. `sampled`
            indicates that at least one repository had languages outside its
            ten-edge GraphQL sample or the owned repository collection was
            capped.
        frameworks:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        recentTechnologies:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecentTechnology"
        contributions:
          $ref: "#/components/schemas/ContributionAnalysis"
        ossExperience:
          $ref: "#/components/schemas/OSSExperience"
        repositoryEvidence:
          $ref: "#/components/schemas/ProfileRepositoryEvidence"
        proficiency:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TechnologyProficiency"
        analysisWindow:
          $ref: "#/components/schemas/ProfileAnalysisWindow"
        repositoriesAnalyzed:
          type: integer
          minimum: 0
          maximum: 20
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisWarning"
    EvidenceStatus:
      type: string
      enum:
        - exact
        - sampled
        - unavailable
      description: |
        `exact` is a complete public count for the documented scope. `sampled`
        is a bounded observation and must not be presented as a total.
        `unavailable` means GitHub did not provide the segment; its value is
        not evidence of zero activity.
    EvidenceConfidence:
      type: string
      enum:
        - high
        - medium
        - low
        - unavailable
    TechnologyKind:
      type: string
      enum:
        - language
        - framework
    RepositoryEvidenceSource:
      type: string
      enum:
        - contributed
        - forked
        - owned
        - starred
    ProfileAnalysisWindow:
      type: object
      additionalProperties: false
      required:
        - days
        - from
        - publicOnly
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        days:
          type: integer
          enum:
            - 365
        publicOnly:
          type: boolean
          const: true
    EvidenceCount:
      type: object
      additionalProperties: false
      required:
        - status
        - value
      properties:
        value:
          type: integer
          minimum: 0
          description: |
            Complete count when status is `exact`, bounded observed count when
            status is `sampled`, and zero placeholder when status is
            `unavailable`. Always interpret this together with `status`.
        status:
          $ref: "#/components/schemas/EvidenceStatus"
    ContributionAnalysis:
      type: object
      additionalProperties: false
      required:
        - commits
        - issuesOpened
        - pullRequestReviews
        - pullRequestsOpened
        - repositoriesTouched
        - windowDays
      properties:
        windowDays:
          type: integer
          enum:
            - 365
        commits:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed commits across at most 20 public repository contribution
            groups. This metric is sampled.
        issuesOpened:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: Exact public authored issue search count in the window.
        pullRequestsOpened:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Exact public authored pull-request search count in the window.
        pullRequestReviews:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed reviews across at most 20 public repository contribution
            groups. This metric is sampled.
        repositoriesTouched:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed unique public repositories across at most 20 commit,
            issue, pull-request, and review contribution groups. This metric
            is sampled.
    TechnologyEvidence:
      type: object
      additionalProperties: false
      required:
        - kind
        - status
        - value
      properties:
        kind:
          type: string
          enum:
            - authored_pull_requests
            - contributed_repositories
            - forked_repositories
            - framework_manifests
            - language_share_percentage
            - owned_repositories
            - pull_request_reviews
            - recent_repositories
        value:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/EvidenceStatus"
    OSSExperience:
      type: object
      additionalProperties: false
      required:
        - confidence
        - evidence
        - level
        - publicOnly
      properties:
        level:
          type: string
          enum:
            - no_public_evidence
            - emerging
            - contributing
            - active
            - sustained
            - unavailable
          description: |
            Rule-based summary of public authored pull requests, public
            contributed repositories, and sampled public review activity.
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        publicOnly:
          type: boolean
          const: true
        evidence:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TechnologyEvidence"
    RecentTechnology:
      type: object
      additionalProperties: false
      required:
        - confidence
        - kind
        - lastUsedAt
        - name
        - repositoryCount
        - repositorySources
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TechnologyKind"
        lastUsedAt:
          type: string
          format: date-time
        repositoryCount:
          type: integer
          minimum: 1
          maximum: 60
        repositorySources:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RepositoryEvidenceSource"
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
    ProfileRepositorySample:
      type: object
      additionalProperties: false
      required:
        - activeInWindow
        - limit
        - observed
        - primaryTechnologies
        - status
        - total
      properties:
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        observed:
          type: integer
          minimum: 0
          maximum: 20
        total:
          type:
            - integer
            - "null"
          minimum: 0
          description: |
            Exact public collection total when GitHub supports a public filter.
            Null for starred evidence because the upstream total can be
            privacy-ambiguous for the authenticated API viewer.
        limit:
          type: integer
          minimum: 0
          maximum: 20
        activeInWindow:
          type: integer
          minimum: 0
          maximum: 20
        primaryTechnologies:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/LanguageShare"
    ProfileRepositoryEvidence:
      type: object
      additionalProperties: false
      required:
        - contributed
        - forked
        - owned
        - starred
      properties:
        owned:
          $ref: "#/components/schemas/ProfileRepositorySample"
        contributed:
          $ref: "#/components/schemas/ProfileRepositorySample"
        starred:
          $ref: "#/components/schemas/ProfileRepositorySample"
        forked:
          $ref: "#/components/schemas/ProfileRepositorySample"
    TechnologyProficiency:
      type: object
      additionalProperties: false
      required:
        - confidence
        - evidence
        - kind
        - label
        - level
        - name
        - score
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TechnologyKind"
        level:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          enum:
            - exploring
            - developing
            - intermediate
            - advanced
            - expert
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Deterministic evidence score used only to select the five-level
            diagnostic. It is not a certification or comprehensive skill
            measurement.
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        evidence:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/TechnologyEvidence"
    RepositoryDiscoveryRequest:
      type: object
      additionalProperties: false
      properties:
        languages:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Accepted primary languages. Matching is case-insensitive logical
            OR. An omitted or empty array accepts every language.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
        technologies:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Framework or technology terms matched as complete terms in public
            topics or bounded README text. If enrichment is unavailable, a
            configured technology filter conservatively excludes that item.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
        licenses:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Supported SPDX identifiers. License matching is logical OR.
            Repositories without a recognized SPDX identifier do not match.
          items:
            $ref: "#/components/schemas/SupportedSPDXLicense"
        categories:
          type: array
          maxItems: 9
          uniqueItems: true
          description: Explainable topic-and-description category, matched by OR.
          items:
            $ref: "#/components/schemas/OSSCategory"
        minimumStars:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 10
        minimumForks:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
        minimumOpenIssues:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
        maximumOpenIssues:
          type: integer
          minimum: 0
          maximum: 10000000
          description: |
            Inclusive maximum. It must be greater than or equal to
            minimumOpenIssues when both are present.
        updatedWithinDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 365
          description: Maximum age of the repository's last public push.
        maximumDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
          description: |
            Inclusive preliminary contribution difficulty. This rule-based
            value evaluates documentation and starter-issue availability; it
            does not estimate a specific issue.
        minimumReadiness:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Inclusive explainable contribution-readiness score.
        hasJapaneseReadme:
          type: boolean
          description: |
            When true, requires Japanese-script README evidence. When false,
            requires analyzed README evidence without detected Japanese text.
            Unavailable evidence matches neither value.
        forkPolicy:
          type: string
          enum:
            - exclude
            - include
            - only
          default: exclude
        excludeArchived:
          type: boolean
          default: true
    SupportedSPDXLicense:
      type: string
      enum:
        - 0BSD
        - AGPL-3.0
        - Apache-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - BSL-1.0
        - CC0-1.0
        - EPL-2.0
        - GPL-2.0
        - GPL-3.0
        - ISC
        - LGPL-2.1
        - LGPL-3.0
        - MIT
        - MPL-2.0
        - Unlicense
    OSSCategory:
      type: string
      enum:
        - application
        - data
        - documentation
        - education
        - framework
        - infrastructure
        - library
        - security
        - tooling
    RepositoryDiscoveryEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/RepositoryDiscoveryResult"
        meta:
          $ref: "#/components/schemas/Meta"
    RepositoryDiscoveryResult:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
        - searchSummary
        - warnings
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RepositoryDiscoveryItem"
        pagination:
          $ref: "#/components/schemas/SearchPagination"
        searchSummary:
          $ref: "#/components/schemas/RepositoryDiscoverySummary"
        warnings:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/RepositoryDiscoveryWarning"
    RepositoryDiscoveryItem:
      type: object
      additionalProperties: false
      required:
        - activity
        - category
        - difficulty
        - documentation
        - language
        - license
        - popularity
        - readiness
        - repository
        - technologies
        - topics
        - warnings
      properties:
        repository:
          $ref: "#/components/schemas/RepositoryDiscoveryIdentity"
        topics:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
        technologies:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Requested technology terms found in topics or README.
          items:
            type: string
            minLength: 1
        language:
          type: string
          description: Empty when GitHub has no primary-language evidence.
        category:
          $ref: "#/components/schemas/OSSCategory"
        license:
          $ref: "#/components/schemas/RepositoryDiscoveryLicense"
        popularity:
          $ref: "#/components/schemas/RepositoryDiscoveryPopularity"
        activity:
          $ref: "#/components/schemas/RepositoryDiscoveryActivity"
        readiness:
          $ref: "#/components/schemas/RepositoryDiscoveryReadiness"
        documentation:
          $ref: "#/components/schemas/RepositoryDiscoveryDocumentation"
        difficulty:
          $ref: "#/components/schemas/RepositoryDiscoveryDifficulty"
        warnings:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/RepositoryDiscoveryWarning"
    RepositoryDiscoveryIdentity:
      type: object
      additionalProperties: false
      required:
        - description
        - fullName
        - isArchived
        - isFork
        - name
        - owner
        - url
      properties:
        owner:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        fullName:
          type: string
          minLength: 3
        description:
          type: string
        url:
          type: string
          format: uri
        isFork:
          type: boolean
        isArchived:
          type: boolean
    RepositoryDiscoveryLicense:
      type: object
      additionalProperties: false
      required:
        - name
        - spdxId
        - status
      properties:
        spdxId:
          type:
            - string
            - "null"
          enum:
            - 0BSD
            - AGPL-3.0
            - Apache-2.0
            - BSD-2-Clause
            - BSD-3-Clause
            - BSL-1.0
            - CC0-1.0
            - EPL-2.0
            - GPL-2.0
            - GPL-3.0
            - ISC
            - LGPL-2.1
            - LGPL-3.0
            - MIT
            - MPL-2.0
            - Unlicense
            - null
        name:
          type: string
        status:
          $ref: "#/components/schemas/EvidenceStatus"
    RepositoryDiscoveryPopularity:
      type: object
      additionalProperties: false
      required:
        - forks
        - openIssues
        - stars
        - watchers
      properties:
        stars:
          type: integer
          minimum: 0
        forks:
          type: integer
          minimum: 0
        watchers:
          type: integer
          minimum: 0
        openIssues:
          type: integer
          minimum: 0
    RepositoryDiscoveryActivity:
      type: object
      additionalProperties: false
      required:
        - pushedAt
        - updatedAt
      properties:
        updatedAt:
          type: string
          format: date-time
        pushedAt:
          type: string
          format: date-time
    RepositoryDiscoveryReadiness:
      type: object
      additionalProperties: false
      required:
        - band
        - discussionsEnabled
        - goodFirstIssues
        - helpWantedIssues
        - issuesEnabled
        - reasons
        - score
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Deterministic sum of bounded activity, documentation, community
            files, starter issues, and public discussion signals.
        band:
          type: string
          enum:
            - needs_work
            - promising
            - ready
        reasons:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
        goodFirstIssues:
          type: integer
          minimum: 0
        helpWantedIssues:
          type: integer
          minimum: 0
        issuesEnabled:
          type: boolean
        discussionsEnabled:
          type: boolean
    RepositoryDiscoveryDocumentation:
      type: object
      additionalProperties: false
      required:
        - codeOfConduct
        - contributingGuide
        - japaneseReadme
        - readmeAvailable
        - securityPolicy
        - status
      properties:
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        readmeAvailable:
          type: boolean
        contributingGuide:
          type: boolean
        codeOfConduct:
          type: boolean
        securityPolicy:
          type: boolean
        japaneseReadme:
          $ref: "#/components/schemas/JapaneseREADMEEvidence"
    JapaneseREADMEEvidence:
      type: object
      additionalProperties: false
      required:
        - analyzedBytes
        - confidence
        - detected
        - japaneseRunes
        - letterRunes
        - status
      properties:
        detected:
          type: boolean
          description: |
            True only when at least 20 Japanese-script runes comprise at least
            five percent of analyzed letters. This is heuristic evidence.
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        japaneseRunes:
          type: integer
          minimum: 0
        letterRunes:
          type: integer
          minimum: 0
        analyzedBytes:
          type: integer
          minimum: 0
          maximum: 65536
    RepositoryDiscoveryDifficulty:
      type: object
      additionalProperties: false
      required:
        - label
        - level
        - reasons
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          enum:
            - very_low
            - low
            - medium
            - high
            - very_high
        reasons:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RepositoryDiscoverySummary:
      type: object
      additionalProperties: false
      required:
        - candidatesChecked
        - enrichmentAttempted
        - enrichmentFailed
        - enrichmentIncomplete
        - githubIncomplete
        - upstreamTotal
      properties:
        candidatesChecked:
          type: integer
          minimum: 0
          maximum: 50
        upstreamTotal:
          type: integer
          minimum: 0
          description: GitHub total before the bounded candidate window.
        enrichmentAttempted:
          type: integer
          minimum: 0
          maximum: 20
        enrichmentFailed:
          type: integer
          minimum: 0
          maximum: 20
        githubIncomplete:
          type: boolean
        enrichmentIncomplete:
          type: boolean
    RepositoryDiscoveryWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - enrichment_unavailable
            - github_results_incomplete
            - readme_content_sampled
            - repository_enrichment_incomplete
        message:
          type: string
          minLength: 1
    IssueSearchRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
          description: |
            The profile whose preferences will be used by later recommendation
            stages. It is included in the canonical cache condition.
          example: tensho1026
        languages:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Repository primary languages matched with GitHub language
            qualifiers. An empty array accepts every language.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Go
            - TypeScript
        frameworks:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Framework terms that must appear as a complete term in issue or
            repository discovery text. An empty array accepts every framework.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Gin
            - React
        labels:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Labels matched using logical OR. If omitted or empty, IssueScout
            uses `good first issue` and `help wanted`.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - good first issue
            - help wanted
        minimumStars:
          type: integer
          minimum: 0
          default: 10
          description: Minimum repository star count applied after normalization.
        maximumDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: |
            Maximum preliminary label-derived difficulty. Full rule-based
            analysis is performed by the recommendation stage.
        maximumEffort:
          type: string
          enum:
            - thirty_minutes
            - two_hours
            - half_day
            - one_day
            - three_days
          description: |
            Inclusive maximum rule-derived effort applied after bounded
            recommendation analysis and before pagination. When omitted, every
            effort band is allowed.
        updatedWithinDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 180
          description: |
            Maximum age for both the issue update and repository update.
        includeDocumentation:
          type: boolean
          default: false
          description: Adds `documentation` to the logical-OR label condition.
        includeEnglish:
          type: boolean
          default: true
          description: |
            Allows predominantly Latin-script issue text. When false, a local
            deterministic script heuristic removes likely English issues.
        excludeArchived:
          type: boolean
          default: true
          description: Excludes issues from archived repositories.
    SearchFilterValue:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        A trimmed search value. Quotes, backslashes, and control characters are
        invalid so values cannot inject GitHub search qualifiers.
      examples:
        - good first issue
    IssueSearchEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/IssueSearchResult"
        meta:
          $ref: "#/components/schemas/Meta"
    IssueSearchResult:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
