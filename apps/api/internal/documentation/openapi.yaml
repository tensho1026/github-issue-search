        HTTPS deployments use Secure `__Host-issuescout_oauth_flow`,
        `__Host-issuescout_session`, and `__Host-issuescout_csrf` names with no
        Domain attribute. Loopback HTTP development uses the same names without
        the `__Host-` prefix and is prohibited outside development/test.
      required: false
