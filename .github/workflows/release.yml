name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, scan, and verify without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 10.12.4
  TRIVY_VERSION: v0.72.0

jobs:
  validate:
    name: Validate release event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag ancestry and version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag is not valid semantic version syntax." >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "Release commit must be reachable from main." >&2
              exit 1
            fi
            echo "is_release=true" >>"${GITHUB_OUTPUT}"
            echo "version=${RELEASE_TAG}" >>"${GITHUB_OUTPUT}"
          else
            echo "is_release=false" >>"${GITHUB_OUTPUT}"
            echo "version=v0.0.0-dry-run.${GITHUB_RUN_ID}" >>"${GITHUB_OUTPUT}"
          fi

  build:
    name: Build and verify release archives
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache-dependency-path: apps/api/go.sum
          go-version-file: apps/api/go.mod

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic API archives
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/release/build-api-artifacts.sh "${VERSION}" artifacts

      - name: Build deterministic web archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/release/build-web-artifact.sh "${VERSION}" artifacts

      - name: Write and verify archive checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bash scripts/release/write-checksums.sh artifacts
          node scripts/release/verify-artifacts.mjs artifacts "${VERSION}"

      - name: Smoke-test packaged Linux API and static web bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/release/smoke-artifacts.sh artifacts "${VERSION}"

      - name: Scan release files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: true
          scan-ref: artifacts
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          version: ${{ env.TRIVY_VERSION }}

      - name: Generate release SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: issuescout-release.spdx.json
          format: spdx-json
          output-file: artifacts/issuescout-release.spdx.json
          path: artifacts
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-inputs-${{ github.run_id }}
          path: artifacts
          retention-days: 14

  publish:
    name: Attest and publish release
    if: needs.validate.outputs.is_release == 'true'
    needs:
      - build
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.run_id }}
          path: artifacts

      - name: Re-verify downloaded archives
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release/verify-artifacts.mjs artifacts "${VERSION}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          sbom-path: artifacts/issuescout-release.spdx.json
          subject-checksums: artifacts/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -t evidence < <(find artifacts -maxdepth 1 -type f -print | sort)
          if [[ "${#evidence[@]}" -eq 0 ]]; then
            echo "No release evidence was downloaded." >&2
            exit 1
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${evidence[@]}" --clobber
          else
            release_arguments=(
              "${VERSION}"
              "${evidence[@]}"
              --generate-notes
              --title "IssueScout ${VERSION}"
              --verify-tag
            )
            if [[ "${VERSION}" == *-* ]]; then
              release_arguments+=(--prerelease)
            fi
            gh release create "${release_arguments[@]}"
          fi

  dry-run-summary:
    name: Confirm non-publishing dry run
    if: needs.validate.outputs.is_release == 'false'
    needs:
      - build
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record dry-run guarantees
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## Secure release dry run"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- API and web archives were built, smoke-tested, scanned, checksummed, and given an SPDX SBOM."
            echo "- No release write, attestation write, environment deployment, or credential access occurred."
          } >>"${GITHUB_STEP_SUMMARY}"
