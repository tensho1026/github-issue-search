            - BSD-3-Clause
            - BSL-1.0
            - CC0-1.0
            - EPL-2.0
            - GPL-2.0
            - GPL-3.0
            - ISC
            - LGPL-2.1
            - LGPL-3.0
            - MIT
            - MPL-2.0
