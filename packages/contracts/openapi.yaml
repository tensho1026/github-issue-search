      properties:
        level:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          minLength: 1
        confidence:
          $ref: "#/components/schemas/Confidence"
    IssueSearchEffortSummary:
      type: object
      additionalProperties: false
