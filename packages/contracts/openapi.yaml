            files, starter issues, and public discussion signals.
        band:
          type: string
          enum:
            - needs_work
            - promising
            - ready
        reasons:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
        goodFirstIssues:
          type: integer
          minimum: 0
        helpWantedIssues:
          type: integer
          minimum: 0
        issuesEnabled:
          type: boolean
        discussionsEnabled:
          type: boolean
    RepositoryDiscoveryDocumentation:
      type: object
      additionalProperties: false
      required:
        - codeOfConduct
        - contributingGuide
        - japaneseReadme
        - readmeAvailable
        - securityPolicy
        - status
      properties:
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        readmeAvailable:
          type: boolean
        contributingGuide:
          type: boolean
        codeOfConduct:
          type: boolean
        securityPolicy:
          type: boolean
        japaneseReadme:
          $ref: "#/components/schemas/JapaneseREADMEEvidence"
    JapaneseREADMEEvidence:
      type: object
      additionalProperties: false
      required:
        - analyzedBytes
        - confidence
        - detected
        - japaneseRunes
        - letterRunes
        - status
      properties:
        detected:
          type: boolean
          description: |
            True only when at least 20 Japanese-script runes comprise at least
            five percent of analyzed letters. This is heuristic evidence.
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        japaneseRunes:
          type: integer
          minimum: 0
        letterRunes:
          type: integer
          minimum: 0
        analyzedBytes:
          type: integer
          minimum: 0
          maximum: 65536
    RepositoryDiscoveryDifficulty:
      type: object
      additionalProperties: false
      required:
        - label
        - level
        - reasons
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          enum:
            - very_low
            - low
            - medium
            - high
            - very_high
        reasons:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RepositoryDiscoverySummary:
      type: object
      additionalProperties: false
      required:
        - candidatesChecked
        - enrichmentAttempted
        - enrichmentFailed
        - enrichmentIncomplete
        - githubIncomplete
        - upstreamTotal
      properties:
        candidatesChecked:
          type: integer
          minimum: 0
          maximum: 50
        upstreamTotal:
          type: integer
          minimum: 0
          description: GitHub total before the bounded candidate window.
        enrichmentAttempted:
          type: integer
          minimum: 0
          maximum: 20
        enrichmentFailed:
          type: integer
          minimum: 0
          maximum: 20
        githubIncomplete:
          type: boolean
        enrichmentIncomplete:
          type: boolean
    RepositoryDiscoveryWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - enrichment_unavailable
            - github_results_incomplete
            - readme_content_sampled
            - repository_enrichment_incomplete
        message:
          type: string
          minLength: 1
    IssueSearchRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
          description: |
            The profile whose preferences will be used by later recommendation
            stages. It is included in the canonical cache condition.
          example: tensho1026
        languages:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Repository primary languages matched with GitHub language
            qualifiers. An empty array accepts every language.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Go
            - TypeScript
        frameworks:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Framework terms that must appear as a complete term in issue or
            repository discovery text. An empty array accepts every framework.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Gin
            - React
        labels:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Labels matched using logical OR. If omitted or empty, IssueScout
            uses `good first issue` and `help wanted`.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - good first issue
            - help wanted
        minimumStars:
          type: integer
          minimum: 0
          default: 10
          description: Minimum repository star count applied after normalization.
        maximumDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: |
            Maximum preliminary label-derived difficulty. Full rule-based
            analysis is performed by the recommendation stage.
        maximumEffort:
          type: string
          enum:
            - thirty_minutes
            - two_hours
            - half_day
            - one_day
            - three_days
          description: |
            Inclusive maximum rule-derived effort applied after bounded
            recommendation analysis and before pagination. When omitted, every
            effort band is allowed.
        updatedWithinDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 180
          description: |
            Maximum age for both the issue update and repository update.
        includeDocumentation:
          type: boolean
          default: false
          description: Adds `documentation` to the logical-OR label condition.
        includeEnglish:
          type: boolean
          default: true
          description: |
            Allows predominantly Latin-script issue text. When false, a local
            deterministic script heuristic removes likely English issues.
        excludeArchived:
          type: boolean
          default: true
          description: Excludes issues from archived repositories.
    SearchFilterValue:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        A trimmed search value. Quotes, backslashes, and control characters are
        invalid so values cannot inject GitHub search qualifiers.
      examples:
        - good first issue
    IssueSearchEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/IssueSearchResult"
        meta:
          $ref: "#/components/schemas/Meta"
    IssueSearchResult:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
        - searchSummary
        - warnings
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/IssueSearchItem"
        pagination:
          $ref: "#/components/schemas/SearchPagination"
        searchSummary:
          $ref: "#/components/schemas/SearchSummary"
        warnings:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/SearchWarning"
    IssueSearchItem:
