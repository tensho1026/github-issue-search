openapi: 3.1.0
info:
  title: IssueScout API
  version: 0.3.0
  description: |
    Stateless API for analyzing a public GitHub profile and finding suitable
    open-source issues. GitHub credentials remain server-side.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security: []
tags:
  - name: System
    description: Runtime health and operational endpoints.
  - name: GitHub profiles
    description: Normalized public GitHub profile and technology analysis.
  - name: Issue discovery
    description: Bounded, validated discovery of eligible public GitHub issues.
  - name: Issue recommendations
    description: Explainable scoring and bounded repository-maintainer analysis.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags:
        - System
      responses:
        "200":
          description: The API process is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}:
    parameters:
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: getGitHubUser
      summary: Get a normalized public GitHub profile
      tags:
        - GitHub profiles
      responses:
        "200":
          description: The public profile and bounded repository summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}/profile-analysis:
    parameters:
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: analyzeGitHubProfile
      summary: Analyze public repository languages and frameworks
      tags:
        - GitHub profiles
      responses:
        "200":
          description: A bounded analysis with optional partial-data warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAnalysisEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/search:
    post:
      operationId: searchGitHubIssues
      summary: Find eligible public GitHub issue candidates
      description: |
        Searches one bounded, authenticated GitHub GraphQL Search window of at
        most 50 candidates and retrieves the required repository fields in the
        same request. It then applies repository and issue eligibility rules
        before application pagination. Equivalent validated filter orderings
        share a five-minute in-memory cache. The endpoint never follows
        unbounded upstream pages, fans out to repository detail requests, or
        returns GitHub response objects directly. The IssueScout endpoint is
        anonymous to browser clients, while the API process requires a
        server-only GITHUB_TOKEN for its upstream GraphQL request.
      tags:
        - Issue discovery
      parameters:
        - name: page
          in: query
          required: false
          description: One-based page over eligible candidates.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          description: Maximum eligible candidates returned on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      requestBody:
        required: true
        description: |
          Validated discovery filters. Omitted scalar filters receive the
          documented MVP defaults. Unknown JSON fields are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSearchRequest"
            examples:
              profile-aligned:
                summary: Search Go and TypeScript starter issues
                value:
                  username: tensho1026
                  languages:
                    - Go
                    - TypeScript
                  frameworks:
                    - Gin
                    - React
                  labels:
                    - good first issue
                    - help wanted
                  minimumStars: 10
                  maximumDifficulty: 3
                  updatedWithinDays: 180
                  includeDocumentation: false
                  includeEnglish: true
                  excludeArchived: true
      responses:
        "200":
          description: |
            Eligible, normalized candidates and bounded pagination metadata.
            A successful response can contain no items.
          headers:
            X-IssueScout-Cache:
              description: Whether the canonical condition was served from cache.
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSearchEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/{owner}/{repository}/{issueNumber}:
    parameters:
      - $ref: "#/components/parameters/GitHubOwner"
      - $ref: "#/components/parameters/GitHubRepository"
      - $ref: "#/components/parameters/GitHubIssueNumber"
    get:
      operationId: getIssueRecommendation
      summary: Get a complete explainable issue recommendation
      description: |
        Retrieves one bounded public GitHub GraphQL snapshot and returns the
        normalized repository, full issue, rule analysis, 100-point score,
        repository-readiness signals, and sampled maintainer activity. Commit,
        issue, pull-request, review, and comment collections are bounded and
        never paginated beyond the documented sample. Missing or partial
        upstream evidence is `unknown` or `unavailable`, never a misleading
        zero or absence. Equivalent owner/repository/number references share a
        five-minute bounded LRU snapshot cache.
      tags:
        - Issue recommendations
      parameters:
        - name: skills
          in: query
          required: false
          description: |
            Repeatable contributor skill. Matching is case-insensitive and
            deduplicated. Low-confidence requirements and a missing skill set
            are excluded from the explicit percentage denominator.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 64
          style: form
          explode: true
          examples:
            go-react:
              value:
                - Go
                - React
      responses:
        "200":
          description: Complete normalized issue recommendation.
          headers:
            X-IssueScout-Cache:
              description: Whether the normalized detail snapshot came from cache.
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetailEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubIssueNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
components:
  parameters:
    GitHubUsername:
      name: username
      in: path
      required: true
      description: Public GitHub login, without a leading at-sign.
      schema:
        type: string
        minLength: 1
        maxLength: 39
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
      example: tensho1026
    GitHubOwner:
      name: owner
      in: path
      required: true
      description: Public GitHub user or organization login.
      schema:
        type: string
        minLength: 1
        maxLength: 39
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
      example: openai
    GitHubRepository:
      name: repository
      in: path
      required: true
      description: Public repository name.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^(?!\\.{1,2}$)[A-Za-z0-9._-]+$"
      example: openai-go
    GitHubIssueNumber:
      name: issueNumber
      in: path
      required: true
      description: Positive repository-local issue number.
      schema:
        type: integer
        minimum: 1
      example: 42
  responses:
    InvalidRequest:
      description: A path or request value failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenOrigin:
      description: The browser Origin is not in the configured allowlist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubUserNotFound:
      description: The requested GitHub user does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubRateLimited:
      description: GitHub refused the request because its rate limit was exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubUpstreamError:
      description: Required public data could not be retrieved from GitHub.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubIssueNotFound:
      description: The public repository or issue does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RequestTimeout:
      description: The bounded request deadline elapsed or the client cancelled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId:
          type: string
          minLength: 1
          example: req_01JTEST123
        timestamp:
          type: string
          format: date-time
        rateLimitRemaining:
          type: integer
          minimum: 0
          example: 4998
    HealthEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ok
        meta:
          $ref: "#/components/schemas/Meta"
    GitHubUserEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/GitHubUser"
        meta:
          $ref: "#/components/schemas/Meta"
    GitHubUser:
      type: object
      additionalProperties: false
      required:
        - avatarUrl
        - bio
        - followers
        - following
        - login
        - name
        - publicRepos
        - repositories
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
        publicRepos:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
        repositories:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RepositorySummary"
    RepositorySummary:
      type: object
      additionalProperties: false
      required:
        - defaultBranch
        - description
        - forks
        - fullName
        - isArchived
        - isFork
        - mainLanguage
        - name
        - openIssues
        - owner
        - pushedAt
        - stars
        - updatedAt
        - url
      properties:
        owner:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        mainLanguage:
          type: string
        stars:
          type: integer
          minimum: 0
        forks:
          type: integer
          minimum: 0
        openIssues:
          type: integer
          minimum: 0
        isFork:
          type: boolean
        isArchived:
          type: boolean
        defaultBranch:
          type: string
        updatedAt:
          type: string
        pushedAt:
          type: string
    ProfileAnalysisEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ProfileAnalysis"
        meta:
          $ref: "#/components/schemas/Meta"
    ProfileAnalysis:
      type: object
      additionalProperties: false
      required:
        - frameworks
        - languages
        - repositoriesAnalyzed
        - username
        - warnings
      properties:
        username:
          type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageShare"
        frameworks:
          type: array
          uniqueItems: true
          items:
            type: string
        repositoriesAnalyzed:
          type: integer
          minimum: 0
          maximum: 20
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisWarning"
    IssueSearchRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 39
          pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
          description: |
            The profile whose preferences will be used by later recommendation
            stages. It is included in the canonical cache condition.
          example: tensho1026
        languages:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Repository primary languages matched with GitHub language
            qualifiers. An empty array accepts every language.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Go
            - TypeScript
        frameworks:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Framework terms that must appear as a complete term in issue or
            repository discovery text. An empty array accepts every framework.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - Gin
            - React
        labels:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Labels matched using logical OR. If omitted or empty, IssueScout
            uses `good first issue` and `help wanted`.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
          example:
            - good first issue
            - help wanted
        minimumStars:
          type: integer
          minimum: 0
          default: 10
          description: Minimum repository star count applied after normalization.
        maximumDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: |
            Maximum preliminary label-derived difficulty. Full rule-based
            analysis is performed by the recommendation stage.
        updatedWithinDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 180
          description: |
            Maximum age for both the issue update and repository update.
        includeDocumentation:
          type: boolean
          default: false
          description: Adds `documentation` to the logical-OR label condition.
        includeEnglish:
          type: boolean
          default: true
          description: |
            Allows predominantly Latin-script issue text. When false, a local
            deterministic script heuristic removes likely English issues.
        excludeArchived:
          type: boolean
          default: true
          description: Excludes issues from archived repositories.
    SearchFilterValue:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        A trimmed search value. Quotes, backslashes, and control characters are
        invalid so values cannot inject GitHub search qualifiers.
      examples:
        - good first issue
    IssueSearchEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/IssueSearchResult"
        meta:
          $ref: "#/components/schemas/Meta"
    IssueSearchResult:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
        - searchSummary
        - warnings
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/IssueSearchItem"
        pagination:
          $ref: "#/components/schemas/SearchPagination"
        searchSummary:
          $ref: "#/components/schemas/SearchSummary"
        warnings:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/SearchWarning"
    IssueSearchItem:
      type: object
      additionalProperties: false
      required:
        - issue
        - recommendation
        - repository
      properties:
        repository:
          $ref: "#/components/schemas/IssueSearchRepository"
        issue:
          $ref: "#/components/schemas/IssueSearchIssue"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
    IssueSearchRepository:
      type: object
      additionalProperties: false
      required:
        - description
        - fullName
        - isArchived
        - lastUpdatedAt
        - mainLanguage
        - name
        - owner
        - stars
        - url
      properties:
        owner:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        fullName:
          type: string
          minLength: 3
        description:
          type: string
        url:
          type: string
          format: uri
        stars:
          type: integer
          minimum: 0
        mainLanguage:
          type: string
        isArchived:
          type: boolean
        lastUpdatedAt:
          type: string
          format: date-time
    IssueSearchIssue:
      type: object
      additionalProperties: false
      required:
        - comments
        - createdAt
        - estimatedDifficulty
        - labels
        - number
        - title
        - updatedAt
        - url
      properties:
        number:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        labels:
          type: array
          items:
            type: string
            minLength: 1
        comments:
          type: integer
          minimum: 0
        estimatedDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          description: Full rule-derived difficulty.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SearchPagination:
      type: object
      additionalProperties: false
      required:
        - hasNext
        - page
        - perPage
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
          maximum: 50
        totalPages:
          type: integer
          minimum: 0
          maximum: 50
        hasNext:
          type: boolean
    SearchSummary:
      type: object
      additionalProperties: false
      required:
        - candidatesChecked
        - enrichmentAttempted
        - enrichmentFailed
        - excludedByReason
        - upstreamTotal
      properties:
        candidatesChecked:
          type: integer
          minimum: 0
          maximum: 50
          description: Candidates evaluated from the bounded upstream window.
        upstreamTotal:
          type: integer
          minimum: 0
          description: |
            GitHub's reported total before the 50-candidate window and local
            eligibility filters. This is not the pagination total.
        enrichmentAttempted:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            Distinct repository leaders selected from the at-most-20-candidate
            analysis window. Sibling issues reuse normalized repository
            evidence without reusing issue-comment claim evidence.
        enrichmentFailed:
          type: integer
          minimum: 0
          maximum: 20
          description: |
            Distinct repository inspections that fell back to candidate
            metadata.
        excludedByReason:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ExclusionCount"
    ExclusionCount:
      type: object
      additionalProperties: false
      required:
        - count
        - reason
      properties:
        reason:
          type: string
          enum:
            - above_maximum_difficulty
            - already_assigned
            - archived_repository
            - below_minimum_stars
            - bot_generated
            - english_not_allowed
            - framework_mismatch
            - insufficient_description
            - label_mismatch
            - language_mismatch
            - not_open
            - pull_request
            - stale
            - suspected_sensitive_content
        count:
          type: integer
          minimum: 1
          maximum: 50
    SearchWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - github_search_incomplete
            - issue_enrichment_incomplete
        message:
          type: string
          minLength: 1
    Recommendation:
      type: object
      additionalProperties: false
      required:
        - breakdown
        - claim
        - reasons
        - score
        - skillMatch
        - warnings
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        breakdown:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/ScoreComponent"
        skillMatch:
          $ref: "#/components/schemas/SkillMatch"
        reasons:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
        warnings:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecommendationWarning"
        claim:
          $ref: "#/components/schemas/ClaimEvidence"
    ScoreComponent:
      type: object
      additionalProperties: false
      required:
        - maximum
        - name
        - reasons
        - score
      properties:
        name:
          type: string
          enum:
            - activity
            - availability
            - issue_quality
            - maintainer_responsiveness
            - repository_quality
            - skill_match
        score:
          type: integer
          minimum: 0
          maximum: 30
        maximum:
          type: integer
          enum:
            - 10
            - 15
            - 20
            - 30
        reasons:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
    SkillMatch:
      type: object
      additionalProperties: false
      required:
        - denominator
        - matched
        - percentage
        - skills
      properties:
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        matched:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
        skills:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SkillMatchItem"
    SkillMatchItem:
      type: object
      additionalProperties: false
      required:
        - evidence
        - status
        - technology
      properties:
        technology:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - matched
            - unmatched
            - unknown
        evidence:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Evidence"
    RecommendationWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - evidence
        - message
        - severity
      properties:
        code:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
        message:
          type: string
          minLength: 1
        evidence:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Evidence"
    ClaimEvidence:
      type: object
      additionalProperties: false
      required:
        - claimed
        - confidence
        - evidence
      properties:
        claimed:
          type: boolean
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Evidence"
    Evidence:
      type: object
      additionalProperties: false
      required:
        - description
        - ruleId
        - source
      properties:
        ruleId:
          type: string
          minLength: 1
        source:
          type: string
          enum:
            - body
            - dependency
            - derived
            - issue_metadata
            - label
            - repository_language
            - title
        description:
          type: string
          minLength: 1
    Confidence:
      type: string
      enum:
        - low
        - medium
        - high
    SignalState:
      type: string
      enum:
        - present
        - absent
        - not_applicable
        - unknown
    IssueDetailEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/IssueDetail"
        meta:
          $ref: "#/components/schemas/Meta"
    IssueDetail:
      type: object
      additionalProperties: false
      required:
        - activity
        - analysis
        - inspection
        - issue
        - recommendation
        - repository
        - repositoryHealth
      properties:
        repository:
          $ref: "#/components/schemas/IssueDetailRepository"
        issue:
          $ref: "#/components/schemas/IssueDetailIssue"
        analysis:
          $ref: "#/components/schemas/IssueAnalysis"
        recommendation:
          $ref: "#/components/schemas/Recommendation"
        repositoryHealth:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/RepositorySignal"
        activity:
          $ref: "#/components/schemas/ActivityMetrics"
        inspection:
          type: object
