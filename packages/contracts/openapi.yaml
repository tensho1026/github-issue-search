openapi: 3.1.0
info:
  title: IssueScout API
  version: 0.5.0
  description: |
    Stateless API for analyzing a public GitHub profile and finding suitable
    open-source repositories and issues. GitHub credentials remain server-side.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security: []
tags:
  - name: System
    description: Runtime health and operational endpoints.
  - name: GitHub profiles
    description: Normalized public GitHub profile and technology analysis.
  - name: Issue discovery
    description: Bounded, validated discovery of eligible public GitHub issues.
  - name: Repository discovery
    description: Bounded, evidence-oriented discovery of public OSS repositories.
  - name: Issue recommendations
    description: Explainable scoring and bounded repository-maintainer analysis.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags:
        - System
      responses:
        "200":
          description: The API process is ready to serve requests.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}:
    parameters:
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: getGitHubUser
      summary: Get a normalized public GitHub profile
      tags:
        - GitHub profiles
      responses:
        "200":
          description: The public profile and bounded repository summaries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubUserEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/github/users/{username}/profile-analysis:
    parameters:
      - $ref: "#/components/parameters/GitHubUsername"
    get:
      operationId: analyzeGitHubProfile
      summary: Analyze bounded public technical and OSS evidence
      description: |
        Executes one bounded GitHub GraphQL snapshot over active public owned
        repositories, public forks, public contributed repositories, visible
        starred repositories, public authored issues and pull requests, and
        sampled public commit and review activity. The analysis window is 365
        days. Repository collections are capped at 20 and language edges at 10
        per owned repository. Exact, sampled, and unavailable evidence are
        distinct so zero is never used for missing data. Starred repositories
        represent interest and never increase proficiency scores. Private and
        restricted contribution totals are neither requested nor returned.
        Anonymous requests do not use a database or persist the username,
        upstream response, or derived profile.
      tags:
        - GitHub profiles
      responses:
        "200":
          description: A bounded analysis with optional partial-data warnings.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAnalysisEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubUserNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/search:
    post:
      operationId: searchGitHubIssues
      summary: Find eligible public GitHub issue candidates
      description: |
        Searches one bounded, authenticated GitHub GraphQL Search window of at
        most 50 candidates and retrieves the required repository fields in the
        same request. It then applies repository and issue eligibility rules
        before bounded detail enrichment, effort filtering, stable ranking,
        and application pagination. Equivalent validated discovery filter
        orderings share a five-minute in-memory candidate cache. At most 20
        candidates are enriched with bounded concurrency, and effort-only
        changes reuse the candidate window. The endpoint never follows
        unbounded upstream pages or returns GitHub response objects directly.
        The IssueScout endpoint is anonymous to browser clients, while the API
        process requires a server-only GITHUB_TOKEN for upstream GraphQL
        requests.
      tags:
        - Issue discovery
      parameters:
        - name: page
          in: query
          required: false
          description: One-based page over eligible candidates.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          description: Maximum eligible candidates returned on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      requestBody:
        required: true
        description: |
          Validated discovery filters. Omitted scalar filters receive the
          documented MVP defaults. Unknown JSON fields are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSearchRequest"
            examples:
              profile-aligned:
                summary: Search Go and TypeScript starter issues
                value:
                  username: tensho1026
                  languages:
                    - Go
                    - TypeScript
                  frameworks:
                    - Gin
                    - React
                  labels:
                    - good first issue
                    - help wanted
                  minimumStars: 10
                  maximumDifficulty: 3
                  maximumEffort: one_day
                  updatedWithinDays: 180
                  includeDocumentation: false
                  includeEnglish: true
                  excludeArchived: true
      responses:
        "200":
          description: |
            Eligible, normalized candidates and bounded pagination metadata.
            A successful response can contain no items.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              description: Whether the canonical condition was served from cache.
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSearchEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/repositories/search:
    post:
      operationId: searchGitHubRepositories
      summary: Find contribution-ready public OSS repositories
      description: |
        Executes one bounded GitHub REST repository search containing at most
        50 normalized public candidates. Cheap language, SPDX license,
        popularity, fork, issue-count, archive, and recency filters run before
        a shortlist of at most 20 repositories receives one batched GraphQL
        quality and documentation enrichment. README language and technology
        detection are heuristics over at most 64 KiB of text and always expose
        evidence status and confidence. The final order is deterministic:
        readiness, stars, last push, then canonical full name. Equivalent
        validated conditions share a five-minute bounded in-memory cache.
        Anonymous requests never access a database or persist the query or
        results.
      tags:
        - Repository discovery
      parameters:
        - name: page
          in: query
          required: false
          description: One-based page over the bounded analyzed shortlist.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          description: Maximum analyzed repositories returned on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          example: 20
      requestBody:
        required: true
        description: |
          Validated public repository filters. Unknown fields and unsupported
          SPDX identifiers or range combinations are rejected before GitHub.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryDiscoveryRequest"
            examples:
              typed-japanese-projects:
                summary: Active React or TypeScript projects with Japanese docs
                value:
                  languages:
                    - TypeScript
                  technologies:
                    - React
                  licenses:
                    - MIT
                    - Apache-2.0
                  categories:
                    - framework
                    - tooling
                  minimumStars: 50
                  minimumForks: 2
                  minimumOpenIssues: 1
                  maximumOpenIssues: 500
                  updatedWithinDays: 180
                  maximumDifficulty: 3
                  minimumReadiness: 50
                  hasJapaneseReadme: true
                  forkPolicy: exclude
                  excludeArchived: true
      responses:
        "200":
          description: |
            Deterministically ordered normalized repositories with bounded
            enrichment, evidence precision, and pagination metadata. A
            successful partial or empty result is valid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              description: Whether the canonical condition was served from cache.
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDiscoveryEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
  /api/issues/{owner}/{repository}/{issueNumber}:
    parameters:
      - $ref: "#/components/parameters/GitHubOwner"
      - $ref: "#/components/parameters/GitHubRepository"
      - $ref: "#/components/parameters/GitHubIssueNumber"
    get:
      operationId: getIssueRecommendation
      summary: Get a complete explainable issue recommendation
      description: |
        Retrieves one bounded public GitHub GraphQL snapshot and returns the
        normalized repository, full issue, rule analysis, 100-point score,
        repository-readiness signals, and sampled maintainer activity. Commit,
        issue, pull-request, review, and comment collections are bounded and
        never paginated beyond the documented sample. Missing or partial
        upstream evidence is `unknown` or `unavailable`, never a misleading
        zero or absence. Equivalent owner/repository/number references share a
        five-minute bounded LRU snapshot cache.
      tags:
        - Issue recommendations
      parameters:
        - name: skills
          in: query
          required: false
          description: |
            Repeatable contributor skill. Matching is case-insensitive and
            deduplicated. Low-confidence requirements and a missing skill set
            are excluded from the explicit percentage denominator.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 64
          style: form
          explode: true
          examples:
            go-react:
              value:
                - Go
                - React
      responses:
        "200":
          description: Complete normalized issue recommendation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-IssueScout-Cache:
              description: Whether the normalized detail snapshot came from cache.
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetailEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "404":
          $ref: "#/components/responses/GitHubIssueNotFound"
        "429":
          $ref: "#/components/responses/GitHubRateLimited"
        "502":
          $ref: "#/components/responses/GitHubUpstreamError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "504":
          $ref: "#/components/responses/RequestTimeout"
components:
  headers:
    RequestID:
      description: |
        Request correlation identifier. A valid inbound X-Request-ID is echoed;
        otherwise the API generates one. This value matches meta.requestId.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  parameters:
    GitHubUsername:
      name: username
      in: path
      required: true
      description: Public GitHub login, without a leading at-sign.
      schema:
        type: string
        minLength: 1
        maxLength: 39
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
      example: tensho1026
    GitHubOwner:
      name: owner
      in: path
      required: true
      description: Public GitHub user or organization login.
      schema:
        type: string
        minLength: 1
        maxLength: 39
        pattern: "^[A-Za-z0-9](?:[A-Za-z0-9]|-(?!-)){0,37}[A-Za-z0-9]$|^[A-Za-z0-9]$"
      example: openai
    GitHubRepository:
      name: repository
      in: path
      required: true
      description: Public repository name.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^(?!\\.{1,2}$)[A-Za-z0-9._-]+$"
      example: openai-go
    GitHubIssueNumber:
      name: issueNumber
      in: path
      required: true
      description: Positive repository-local issue number.
      schema:
        type: integer
        minimum: 1
      example: 42
  responses:
    InvalidRequest:
      description: A path or request value failed validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenOrigin:
      description: The browser Origin is not in the configured allowlist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubUserNotFound:
      description: The requested GitHub user does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubRateLimited:
      description: GitHub refused the request because its rate limit was exhausted.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubUpstreamError:
      description: Required public data could not be retrieved from GitHub.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubIssueNotFound:
      description: The public repository or issue does not exist or is not visible.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RequestTimeout:
      description: The bounded request deadline elapsed or the client cancelled.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: An unexpected internal failure was recovered without exposing details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId:
          type: string
          minLength: 1
          example: req_01JTEST123
        timestamp:
          type: string
          format: date-time
        rateLimitRemaining:
          type: integer
          minimum: 0
          example: 4998
    HealthEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ok
        meta:
          $ref: "#/components/schemas/Meta"
    GitHubUserEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/GitHubUser"
        meta:
          $ref: "#/components/schemas/Meta"
    GitHubUser:
      type: object
      additionalProperties: false
      required:
        - avatarUrl
        - bio
        - followers
        - following
        - login
        - name
        - publicRepos
        - repositories
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        bio:
          type: string
        publicRepos:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
        repositories:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RepositorySummary"
    RepositorySummary:
      type: object
      additionalProperties: false
      required:
        - defaultBranch
        - description
        - forks
        - fullName
        - isArchived
        - isFork
        - mainLanguage
        - name
        - openIssues
        - owner
        - pushedAt
        - stars
        - updatedAt
        - url
      properties:
        owner:
          type: string
        name:
          type: string
        fullName:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        mainLanguage:
          type: string
        stars:
          type: integer
          minimum: 0
        forks:
          type: integer
          minimum: 0
        openIssues:
          type: integer
          minimum: 0
        isFork:
          type: boolean
        isArchived:
          type: boolean
        defaultBranch:
          type: string
        updatedAt:
          type: string
        pushedAt:
          type: string
    ProfileAnalysisEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/ProfileAnalysis"
        meta:
          $ref: "#/components/schemas/Meta"
    ProfileAnalysis:
      type: object
      additionalProperties: false
      required:
        - analysisWindow
        - contributions
        - frameworks
        - languageStatus
        - languages
        - ossExperience
        - proficiency
        - recentTechnologies
        - repositoryEvidence
        - repositoriesAnalyzed
        - username
        - warnings
      properties:
        username:
          type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageShare"
        languageStatus:
          allOf:
            - $ref: "#/components/schemas/EvidenceStatus"
          description: |
            Completeness of the aggregate language percentages. `sampled`
            indicates that at least one repository had languages outside its
            ten-edge GraphQL sample or the owned repository collection was
            capped.
        frameworks:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        recentTechnologies:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RecentTechnology"
        contributions:
          $ref: "#/components/schemas/ContributionAnalysis"
        ossExperience:
          $ref: "#/components/schemas/OSSExperience"
        repositoryEvidence:
          $ref: "#/components/schemas/ProfileRepositoryEvidence"
        proficiency:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TechnologyProficiency"
        analysisWindow:
          $ref: "#/components/schemas/ProfileAnalysisWindow"
        repositoriesAnalyzed:
          type: integer
          minimum: 0
          maximum: 20
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisWarning"
    EvidenceStatus:
      type: string
      enum:
        - exact
        - sampled
        - unavailable
      description: |
        `exact` is a complete public count for the documented scope. `sampled`
        is a bounded observation and must not be presented as a total.
        `unavailable` means GitHub did not provide the segment; its value is
        not evidence of zero activity.
    EvidenceConfidence:
      type: string
      enum:
        - high
        - medium
        - low
        - unavailable
    TechnologyKind:
      type: string
      enum:
        - language
        - framework
    RepositoryEvidenceSource:
      type: string
      enum:
        - contributed
        - forked
        - owned
        - starred
    ProfileAnalysisWindow:
      type: object
      additionalProperties: false
      required:
        - days
        - from
        - publicOnly
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        days:
          type: integer
          enum:
            - 365
        publicOnly:
          type: boolean
          const: true
    EvidenceCount:
      type: object
      additionalProperties: false
      required:
        - status
        - value
      properties:
        value:
          type: integer
          minimum: 0
          description: |
            Complete count when status is `exact`, bounded observed count when
            status is `sampled`, and zero placeholder when status is
            `unavailable`. Always interpret this together with `status`.
        status:
          $ref: "#/components/schemas/EvidenceStatus"
    ContributionAnalysis:
      type: object
      additionalProperties: false
      required:
        - commits
        - issuesOpened
        - pullRequestReviews
        - pullRequestsOpened
        - repositoriesTouched
        - windowDays
      properties:
        windowDays:
          type: integer
          enum:
            - 365
        commits:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed commits across at most 20 public repository contribution
            groups. This metric is sampled.
        issuesOpened:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: Exact public authored issue search count in the window.
        pullRequestsOpened:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Exact public authored pull-request search count in the window.
        pullRequestReviews:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed reviews across at most 20 public repository contribution
            groups. This metric is sampled.
        repositoriesTouched:
          allOf:
            - $ref: "#/components/schemas/EvidenceCount"
          description: |
            Observed unique public repositories across at most 20 commit,
            issue, pull-request, and review contribution groups. This metric
            is sampled.
    TechnologyEvidence:
      type: object
      additionalProperties: false
      required:
        - kind
        - status
        - value
      properties:
        kind:
          type: string
          enum:
            - authored_pull_requests
            - contributed_repositories
            - forked_repositories
            - framework_manifests
            - language_share_percentage
            - owned_repositories
            - pull_request_reviews
            - recent_repositories
        value:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/EvidenceStatus"
    OSSExperience:
      type: object
      additionalProperties: false
      required:
        - confidence
        - evidence
        - level
        - publicOnly
      properties:
        level:
          type: string
          enum:
            - no_public_evidence
            - emerging
            - contributing
            - active
            - sustained
            - unavailable
          description: |
            Rule-based summary of public authored pull requests, public
            contributed repositories, and sampled public review activity.
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        publicOnly:
          type: boolean
          const: true
        evidence:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/TechnologyEvidence"
    RecentTechnology:
      type: object
      additionalProperties: false
      required:
        - confidence
        - kind
        - lastUsedAt
        - name
        - repositoryCount
        - repositorySources
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TechnologyKind"
        lastUsedAt:
          type: string
          format: date-time
        repositoryCount:
          type: integer
          minimum: 1
          maximum: 60
        repositorySources:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RepositoryEvidenceSource"
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
    ProfileRepositorySample:
      type: object
      additionalProperties: false
      required:
        - activeInWindow
        - limit
        - observed
        - primaryTechnologies
        - status
        - total
      properties:
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        observed:
          type: integer
          minimum: 0
          maximum: 20
        total:
          type:
            - integer
            - "null"
          minimum: 0
          description: |
            Exact public collection total when GitHub supports a public filter.
            Null for starred evidence because the upstream total can be
            privacy-ambiguous for the authenticated API viewer.
        limit:
          type: integer
          minimum: 0
          maximum: 20
        activeInWindow:
          type: integer
          minimum: 0
          maximum: 20
        primaryTechnologies:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/LanguageShare"
    ProfileRepositoryEvidence:
      type: object
      additionalProperties: false
      required:
        - contributed
        - forked
        - owned
        - starred
      properties:
        owned:
          $ref: "#/components/schemas/ProfileRepositorySample"
        contributed:
          $ref: "#/components/schemas/ProfileRepositorySample"
        starred:
          $ref: "#/components/schemas/ProfileRepositorySample"
        forked:
          $ref: "#/components/schemas/ProfileRepositorySample"
    TechnologyProficiency:
      type: object
      additionalProperties: false
      required:
        - confidence
        - evidence
        - kind
        - label
        - level
        - name
        - score
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TechnologyKind"
        level:
          type: integer
          minimum: 1
          maximum: 5
        label:
          type: string
          enum:
            - exploring
            - developing
            - intermediate
            - advanced
            - expert
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Deterministic evidence score used only to select the five-level
            diagnostic. It is not a certification or comprehensive skill
            measurement.
        confidence:
          $ref: "#/components/schemas/EvidenceConfidence"
        evidence:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/TechnologyEvidence"
    RepositoryDiscoveryRequest:
      type: object
      additionalProperties: false
      properties:
        languages:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Accepted primary languages. Matching is case-insensitive logical
            OR. An omitted or empty array accepts every language.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
        technologies:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Framework or technology terms matched as complete terms in public
            topics or bounded README text. If enrichment is unavailable, a
            configured technology filter conservatively excludes that item.
          items:
            $ref: "#/components/schemas/SearchFilterValue"
        licenses:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            Supported SPDX identifiers. License matching is logical OR.
            Repositories without a recognized SPDX identifier do not match.
          items:
            $ref: "#/components/schemas/SupportedSPDXLicense"
        categories:
          type: array
          maxItems: 9
          uniqueItems: true
          description: Explainable topic-and-description category, matched by OR.
          items:
            $ref: "#/components/schemas/OSSCategory"
        minimumStars:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 10
        minimumForks:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
        minimumOpenIssues:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
        maximumOpenIssues:
          type: integer
          minimum: 0
          maximum: 10000000
          description: |
            Inclusive maximum. It must be greater than or equal to
            minimumOpenIssues when both are present.
        updatedWithinDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 365
          description: Maximum age of the repository's last public push.
        maximumDifficulty:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
          description: |
            Inclusive preliminary contribution difficulty. This rule-based
            value evaluates documentation and starter-issue availability; it
            does not estimate a specific issue.
        minimumReadiness:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Inclusive explainable contribution-readiness score.
        hasJapaneseReadme:
          type: boolean
          description: |
            When true, requires Japanese-script README evidence. When false,
            requires analyzed README evidence without detected Japanese text.
            Unavailable evidence matches neither value.
        forkPolicy:
          type: string
          enum:
            - exclude
            - include
            - only
          default: exclude
        excludeArchived:
          type: boolean
          default: true
    SupportedSPDXLicense:
      type: string
      enum:
        - 0BSD
        - AGPL-3.0
        - Apache-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - BSL-1.0
        - CC0-1.0
        - EPL-2.0
        - GPL-2.0
        - GPL-3.0
        - ISC
        - LGPL-2.1
        - LGPL-3.0
